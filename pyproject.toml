[tool.poetry]
name = "ui-review-agent"
version = "0.1.0"
description = "A browser agent that reviews web UIs like a QA engineer: crawls a site in headless Chromium, screenshots every page at mobile/tablet/desktop in light and dark mode, finds layout, accessibility and visual-regression bugs with deterministic checks first and an optional local vision model second, and reports to HTML, JSON and JUnit."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/ui-review-agent"
repository = "https://github.com/MartinCastroAlvarez/ui-review-agent"
documentation = "https://github.com/MartinCastroAlvarez/ui-review-agent#readme"
keywords = [
    "ui-testing",
    "visual-regression",
    "accessibility",
    "playwright",
    "browser-agent",
    "react-agent",
    "axe-core",
    "ollama",
    "vision-language-model",
    "qa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "ui_review" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
ui-review = "ui_review.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
playwright = ">=1.50,<2"
pillow = ">=12,<14"
httpx = ">=0.27,<1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "S101", "S104", "S105", "S106", "S108", "S310", "S311", "S314", "S405", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["ui_review", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ui_review",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = ["browser: needs headless Chromium (Playwright)"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["ui_review"]
# Playwright's sync API runs on greenlets.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.$",
]
omit = [
    "ui_review/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
