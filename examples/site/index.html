<html lang="en">

  <title>Acme Widgets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>

  <main>
    <h1>Widgets that just work</h1>
    <p class="lead">Acme builds sturdy widgets for teams of every size.</p>
    <!-- BUG broken-image: the hero file was never committed. -->
    <img src="img/hero.png" alt="A widget on a desk" width="640" height="320">
    <div class="card">
      <h2>Why Acme</h2>
      <!-- BUG a11y image-alt: an informative image without alt text. -->
      <img src="img/badge.svg" width="48" height="48">

    </div>
    <div class="card">
      <h2>Newsletter</h2>
      <!-- The agent must never submit this form (it would POST). -->
      <form method="post" action="subscribe">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="qa@example.com" style="padding: 10px; font-size: 16px">
        <button class="btn" type="submit">Subscribe</button>
      </form>
    </div>
    <!-- Off-site tracking pixel: the sandbox blocks the request. -->
    <img src="https://tracker.example.com/pixel.gif" alt="" width="1" height="1">
