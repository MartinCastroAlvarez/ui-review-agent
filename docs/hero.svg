<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="64" font-weight="700" fill="#f1f5f9">ui-review-agent</text>
    <text x="80" y="170" font-size="27" fill="#94a3b8">A browser agent that reviews web UIs like a QA engineer.</text>
    <text x="80" y="208" font-size="21" fill="#38bdf8">Playwright · axe-core · pixel diff · local VLM on ollama · 100% local</text>

    <!-- input -->
    <rect x="80" y="300" width="170" height="120" rx="14" fill="#111a33" stroke="#334155" stroke-width="2"/>
    <text x="165" y="350" font-size="21" fill="#e2e8f0" text-anchor="middle">URL or</text>
    <text x="165" y="380" font-size="21" fill="#e2e8f0" text-anchor="middle">./dist</text>
    <line x1="252" y1="360" x2="318" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- viewports -->
    <text x="460" y="276" font-size="18" fill="#94a3b8" text-anchor="middle">crawl × 3 viewports × light/dark</text>
    <g>
      <rect x="328" y="300" width="58" height="120" rx="10" fill="#f8fafc"/>
      <rect x="336" y="314" width="42" height="8" rx="3" fill="#94a3b8"/>
      <rect x="336" y="330" width="58" height="8" rx="3" fill="#ef4444"/>
      <rect x="336" y="346" width="30" height="8" rx="3" fill="#94a3b8"/>
      <rect x="400" y="300" width="96" height="120" rx="10" fill="#1e293b" stroke="#475569"/>
      <rect x="410" y="316" width="70" height="8" rx="3" fill="#64748b"/>
      <rect x="410" y="332" width="50" height="8" rx="3" fill="#64748b"/>
      <rect x="410" y="360" width="76" height="40" rx="6" fill="#f1f5f9" opacity="0.9"/>
      <rect x="510" y="300" width="96" height="120" rx="10" fill="#f8fafc"/>
      <rect x="520" y="316" width="76" height="8" rx="3" fill="#94a3b8"/>
      <rect x="520" y="332" width="40" height="8" rx="3" fill="#94a3b8"/>
      <rect x="526" y="346" width="40" height="40" rx="4" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 4"/>
    </g>
    <line x1="618" y1="360" x2="684" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- checks -->
    <rect x="694" y="262" width="250" height="88" rx="14" fill="#111a33" stroke="#38bdf8" stroke-width="2"/>
    <text x="819" y="298" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">Deterministic checks</text>
    <text x="819" y="326" font-size="15" fill="#94a3b8" text-anchor="middle">overflow · overlap · a11y · diff</text>
    <rect x="694" y="370" width="250" height="88" rx="14" fill="#111a33" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="819" y="406" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">Vision critique</text>
    <text x="819" y="434" font-size="15" fill="#94a3b8" text-anchor="middle">optional local VLM</text>
    <line x1="946" y1="360" x2="1012" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- outputs -->
    <rect x="1022" y="290" width="178" height="140" rx="14" fill="#111a33" stroke="#334155" stroke-width="2"/>
    <text x="1111" y="330" font-size="19" fill="#f87171" text-anchor="middle">● 1 critical</text>
    <text x="1111" y="360" font-size="19" fill="#fb923c" text-anchor="middle">● 10 major</text>
    <text x="1111" y="400" font-size="17" fill="#e2e8f0" text-anchor="middle">HTML · JSON · JUnit</text>

    <!-- loop -->
    <path d="M 819 470 C 819 545, 465 545, 465 432" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="642" y="574" font-size="18" fill="#94a3b8" text-anchor="middle">ReAct loop: observe → think → act (goto · click · scroll · axe_audit · compare_baseline)</text>
  </g>
</svg>
